services:
  lmb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BASE_URL_PORT:-8080}:${BASE_URL_PORT:-8080}"
    env_file:
      - .env
    environment:
      BASE_URL_PORT: ${BASE_URL_PORT:-8080}
      CBGRAM_RUST_CORE: ${CBGRAM_RUST_CORE:-1}
      CBGRAM_UVLOOP: ${CBGRAM_UVLOOP:-1}
      CBGRAM_MAX_CONCURRENT: ${CBGRAM_MAX_CONCURRENT:-256}
      CBGRAM_WORKERS: ${CBGRAM_WORKERS:-128}
      CBGRAM_SESSION_DIR: ${CBGRAM_SESSION_DIR:-/usr/src/app/.sessions}
    volumes:
      - ./.sessions:/usr/src/app/.sessions
      - ./downloads:/usr/src/app/downloads
      - ./thumbnails:/usr/src/app/thumbnails
      - ./tokens:/usr/src/app/tokens
      - ./rclone:/usr/src/app/rclone
      - ./cookies:/usr/src/app/cookies
      - ./Images:/usr/src/app/Images
      - ./configs:/usr/src/app/configs
      - ./logs:/usr/src/app/logs
      - ./config.py:/usr/src/app/config.py:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${BASE_URL_PORT:-8080}/ >/dev/null 2>&1 || pgrep -f 'python.*-m bot' >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
